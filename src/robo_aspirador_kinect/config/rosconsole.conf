# Config de logging (rosconsole) para o projeto.
#
# Silencia o flood de "TF_REPEATED_DATA ignoring data with redundant timestamp
# for frame base_footprint (parent odom)" — ruído inofensivo do plugin Kobuki
# no Gazebo, que publica a TF odom->base_footprint com timestamp repetido.
#
# Sem isso, esses WARN vão para o stderr (=> tela) de vários nós da base do
# TurtleBot e inundam o terminal do menu (mode_selector), impedindo o uso.
#
# Mantém os demais logs no nível padrão (só o tf2 é elevado para ERROR).
log4j.logger.ros.tf2=ERROR
